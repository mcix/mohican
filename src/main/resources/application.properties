server.port=8008

# SSL configuration - will be overridden by SslConfiguration if dynamic keystore exists
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore/mohican2.p12
server.ssl.key-store-password=deltaproto
server.ssl.key-alias=mohican2

server.http.port=8007

info.app.version=@project.version@

# SSL certificate configuration
ssl.certificate.hostname=localhost
ssl.certificate.validity-days=3650

# The log file, so a day of use can be read back: moves with their durations and
# the Teknic driver's reports (INFO), every position change (DEBUG, switched on
# from the web page's info panel). Rolled daily, two weeks kept.
logging.file.name=${user.home}/mohican/mohican.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=300MB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{30} - %msg%n
