# Only needed to force the Teknic driver; the port number itself is not used, the
# driver finds the hub by itself (see motor.driver below).
#teknic.port=11
#teknic.plankje.x=175.82
#teknic.plankje.y=105.75

# Vacuum pump. Machines with the integrated controller (sensor and pump switch
# on the motor controller) need nothing here: leave vacuum.port out. The older
# machines carry the sensor on the HP3 main board and switch the pump through
# an FTDI relay board; set vacuum.port and Mohican runs the pump itself: every
# vacuum.interval.ms it asks the board for the level, switches the pump off
# below vacuum.top and on above vacuum.bottom, and switches it off whenever the
# level cannot be read vacuum.missed.max times in a row or when Mohican exits.
# The relay board is found by its port name (vacuum.relay.match, not the sensor,
# the motor ports or the Teknic hub); set vacuum.relay.port when the log shows
# several candidates ("Several ports could be the vacuum relay").
#vacuum.port=COM10
#vacuum.top=1830
#vacuum.bottom=2000
#vacuum.relay.port=auto
#vacuum.relay.match=(?i)FTDI|USB Serial Port
#vacuum.interval.ms=2000
#vacuum.missed.max=2

#motor.port.x=/dev/tty.usbmodem12301
#motor.port.y=/dev/tty.usbmodem12401

#motor.simulate=true

camera.simulate=true

#motor.port.x=test
#motor.port.y=test

# Motors. Mohican finds the machine by itself: a Teknic ClearPath-SC hub among
# the serial ports means the hybrid placer (Teknic driver), otherwise the serial
# microPlacer boards are probed. Nothing found: it looks again every
# motor.retry.seconds (doubling up to a minute) and after Reconnect.
#   motor.driver=auto      (default) hub when present, else serial
#   motor.driver=teknic    always the Teknic driver (same as setting teknic.port)
#   motor.driver=serial    never look for a hub
# The hub is recognised by the name Windows gives its COM port; the log lists
# every port seen ("Serial ports: COM3 (USB Serial Port), COM11 (Teknic SC-HUB)")
# so the pattern can be widened if a hub calls itself something else.
#teknic.hub.match=(?i)teknic|sc-?hub|clearpath
#motor.retry.seconds=5

# Only one program can hold the machine's port, and the legacy Mohican (the old
# Swing application) neither releases it nor copes with finding it busy. On
# Windows this client therefore ends a running legacy Mohican before it opens
# the machine: every java process whose command line matches legacy.kill.match
# is killed (never this client itself). legacy.kill=false switches that off.
#legacy.kill=true
#legacy.kill.match=(?i)nl\.vanderheijde\.stapper|mohican-\d[\w.-]*-jar-with-dependencies\.jar|mohican-legacy

# Browser origins allowed to drive this client (CORS and the websocket), |-separated.
# Default: http://localhost:[*]|https://localhost:[*]|https://deltaproto.com|https://www.deltaproto.com|https://*.deltaproto.com
#allowed.origins=

